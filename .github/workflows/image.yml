name: image

# Publish the environment image to GHCR -- when it is not there already. x86_64 only.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: The image for this commit's setup/, published by the time this returns.
        value: ${{ jobs.key.outputs.image }}

jobs:
  key:
    runs-on: [self-hosted, slurm, x86_64]
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.ref.outputs.image }}
      exists: ${{ steps.ref.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: |
          image="$(setup/image.sh ref)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if setup/image.sh exists; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$image is published; nothing to build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$image is not published; building it"
          fi

  build:
    needs: key
    if: needs.key.outputs.exists != 'true'
    runs-on: [self-hosted, slurm, big, x86_64]
    timeout-minutes: 110
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ needs.key.outputs.image }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # No docker/setup-buildx-action: its driver cannot start under podman on the runner.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |
          if setup/image.sh exists; then
            echo "published while this job waited; nothing to build"
            exit 0
          fi
          setup/image.sh build --push -j "$(nproc)"
