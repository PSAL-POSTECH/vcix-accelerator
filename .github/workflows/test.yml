name: test

# Build this repository in the environment image and run every test on both simulators.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  test:
    needs: image
    runs-on: [self-hosted, slurm, x86_64]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: scripts/build.sh

      - name: Test on Spike and gem5
        run: tests/run.sh

      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: simulator-logs
          path: build/*.log
          retention-days: 7
